<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  --surface-0:#0A1D2B;--surface-1:#10293A;--surface-2:#163449;--line:#23485F;

}
html,body{margin:0;padding:0}
body{background:var(--surface-0);color:var(--ink);font-size:15px;line-height:1.5;
  font-family:'Barlow',system-ui,-apple-system,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}

.row{display:flex;gap:10px;flex-wrap:wrap}

  border:1px solid var(--line);color:var(--ink-dim)}

<header class="top"><div class="topin">
  <span class="mark disp">SANER</span>
  <span class="eyebrow">coach engine</span>
  <div class="readout"><div class="eyebrow">VDOT</div><div class="v num" id="vdotOut">—</div></div>
</div></header>

<script>
"use strict";

/* ============================================================================
   SANER COACH — standalone. No server, no account, no Claude.ai.
   Everything below runs from this one file. Your data stays in this browser.
   ==========================================================================*/

/* ---------------------------------------------------------------- ENGINE --*/

const DISTANCES=[
  {id:"800",m:800,label:"800 m"},{id:"1500",m:1500,label:"1500 m"},{id:"mile",m:1609,label:"Mile"},
  {id:"3000",m:3000,label:"3000 m"},{id:"5000",m:5000,label:"5 km"},{id:"10000",m:10000,label:"10 km"},
  {id:"half",m:21097,label:"Half"},{id:"marathon",m:42195,label:"Marathon"}];

// Daniels & Gilbert (1979). v in m/min.
const vo2FromVel=v=>-4.6+0.182258*v+0.000104*v*v;
const velFromVo2=vo2=>{const a=0.000104,b=0.182258,c=-4.6-vo2;
  return(-b+Math.sqrt(b*b-4*a*c))/(2*a)};
const pctMax=t=>0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);

const vdotFromRace=(m,s)=>{const t=s/60;if(t<=0||m<=0)return null;
  return vo2FromVel(m/t)/pctMax(t)};

const timeAtVdot=(vd,m)=>{let lo=.5,hi=600;
  for(let i=0;i<80;i++){const mid=(lo+hi)/2;
    (vo2FromVel(m/mid)/pctMax(mid))>vd?lo=mid:hi=mid;}
  return((lo+hi)/2)*60};

const paceForDuration=(vd,min)=>60000/velFromVo2(vd*pctMax(min));
const pctPace=(vd,p)=>60000/velFromVo2(vd*p);

/* The Daniels-Gilbert curve is fitted to races of a few minutes up to about an
   hour. Past that it over-predicts, because a marathon is limited by fuel and
   mechanical damage, not only oxygen — run raw it puts a VDOT 50 athlete at
   3:10 when the real answer is 3:21. This is the fraction of VDOT actually
   holdable for a marathon, fitted to Daniels' published table. It rises with
   fitness because faster runners finish sooner.                             */
const mPct=vd=>Math.max(.73,Math.min(.84,0.764+(vd-50)*0.00155));
const marathonPace=vd=>60000/velFromVo2(vd*mPct(vd));
const raceTimeAtVdot=(vd,m)=>m>30000?(marathonPace(vd)*m)/1000:timeAtVdot(vd,m);

function zonesFromVdot(vd){
  const M=marathonPace(vd);
  const slow=Math.max(70,Math.min(95,90-(vd-40)*0.5));
  return{
    E:{lo:M+slow,hi:M+45,name:"Easy"},
    M:{lo:M,hi:M,name:"Marathon"},
    T:{lo:paceForDuration(vd,60),hi:paceForDuration(vd,60),name:"Threshold"},
    I:{lo:pctPace(vd,1.0),hi:pctPace(vd,1.0),name:"Interval"},
    R:{lo:pctPace(vd,1.075),hi:pctPace(vd,1.075),name:"Repetition"}};
}

const riegel=(t1,d1,d2)=>t1*Math.pow(d2/d1,d2>42195?1.08:1.06);

function criticalSpeed(trials){
  const p=trials.filter(t=>t.m>0&&t.s>0);
  if(p.length<2)return null;
  const n=p.length,sx=p.reduce((a,q)=>a+q.s,0),sy=p.reduce((a,q)=>a+q.m,0),
        sxy=p.reduce((a,q)=>a+q.s*q.m,0),sxx=p.reduce((a,q)=>a+q.s*q.s,0),
        den=n*sxx-sx*sx;
  if(Math.abs(den)<1e-9)return null;
  const cs=(n*sxy-sx*sy)/den,dP=(sy-cs*sx)/n;
  if(cs<=0||dP<=0)return null;
  return{cs:cs,dPrime:dP,pace:1000/cs};
}

const tanakaHRmax=age=>Math.round(208-0.7*age);
const karvonen=(hm,hr,f)=>Math.round(f*(hm-hr)+hr);
const minetti=g=>155.4*Math.pow(g,5)-30.4*Math.pow(g,4)-43.3*Math.pow(g,3)+46.3*g*g+19.5*g+3.6;
const gapFactor=pct=>minetti(pct/100)/3.6;

const sessionLoad=(rpe,min)=>Math.round(rpe*min);
function weekLoadStats(daily){
  const n=daily.length||1,total=daily.reduce((a,b)=>a+b,0),mean=total/n;
  const sd=Math.sqrt(daily.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n)||0;
  const mono=sd>0?mean/sd:0;
  return{total:Math.round(total),monotony:+mono.toFixed(2),strain:Math.round(total*mono)};
}

function detrainFactor(d){
  if(d<=10)return 1;
  const p=[[10,0],[28,.06],[63,.19],[77,.25]];
  for(let i=0;i<p.length-1;i++){
    const a=p[i],b=p[i+1];
    if(d<=b[0])return 1-(a[1]+((d-a[0])/(b[0]-a[0]))*(b[1]-a[1]));
  }
  return .72;
}

const rockportVo2=o=>132.853-0.0769*(o.weightKg*2.20462)-0.3877*o.age+6.315*(o.male?1:0)
  -3.2649*o.minutes-0.1565*o.hr;
const cooperVo2=m=>(m-504.9)/44.73;

/* ---------------------------------------------------------------- FORMAT --*/
function fmtTime(s){
  if(s==null||!isFinite(s))return"--";
  s=Math.round(s);
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;
  return h?h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")
          :m+":"+String(x).padStart(2,"0");
}
const fmtPace=fmtTime;
function parseTime(str){
  if(!str)return null;
  const p=String(str).trim().split(":").map(Number);
  if(p.some(isNaN))return null;
  if(p.length===3)return p[0]*3600+p[1]*60+p[2];
  if(p.length===2)return p[0]*60+p[1];
  return p[0];
}
const lapFrom=(sec,m)=>sec*m/1000;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ----------------------------------------------------------------- GUARD --*/

const PARQ=[
 "A doctor has told you that you have a heart condition, or high blood pressure.",
 "You get chest pain at rest, during daily activities, or when you exercise.",
 "You lose balance from dizziness, or you have lost consciousness, in the last 12 months.",
 "You have another chronic medical condition that a doctor has diagnosed.",
 "You are currently taking prescribed medication for a chronic condition.",
 "You have a bone, joint, or soft-tissue problem that more activity could make worse.",
 "A doctor has said you should only exercise under medical supervision."];

const RED_FLAGS=[
 "Chest, neck, jaw or arm discomfort when you exert yourself",
 "Unusual breathlessness at rest or with mild effort",
 "Dizziness or fainting",
 "Palpitations or a racing heart at rest",
 "Ankle swelling, or breathlessness lying flat",
 "Calf or leg pain that starts when walking and stops when you rest"];

const LEA_FLAGS=[
 "Periods have stopped or become irregular (if applicable)",
 "You restrict food deliberately, or feel guilt about eating",
 "You have had two or more bone stress injuries",
 "Persistent fatigue and performance that keeps declining despite training"];

function acsmClearance(o){
  if(o.symptoms)return{level:"stop",text:"Stop. Get medical clearance before any exercise — you've reported a symptom that needs a doctor first."};
  if(o.disease&&!o.active)return{level:"clear",text:"Get medical clearance before starting. Known condition and not currently active."};
  if(o.disease&&o.active)return{level:"clear-vig",text:"You can continue light–moderate exercise. Get clearance before stepping up to vigorous work."};
  if(!o.active&&o.wantsVigorous)return{level:"advise",text:"Clearance isn't required to start light–moderate exercise, but it's recommended before vigorous training."};
  return{level:"ok",text:"No clearance needed. Start light–moderate and build."};
}

/* ------------------------------------------------------------ PLAN ENGINE --*/

const LEVELS={
  never:{label:"Never run",days:3,startKm:0,step:0,maxKm:25,quality:0},
  returning:{label:"Coming back",days:4,startKm:15,step:.06,maxKm:55,quality:1},
  recreational:{label:"Recreational",days:4,startKm:30,step:.07,maxKm:75,quality:2},
  competitive:{label:"Competitive",days:6,startKm:60,step:.07,maxKm:120,quality:3},
  advanced:{label:"Advanced/elite",days:7,startKm:90,step:.06,maxKm:180,quality:3}};

const eventGroup=m=>m<=1609?"speed":m<=5000?"middle":"long";

function phaseFor(w,weeks){
  if(weeks-w<=2)return"Taper";
  const f=w/weeks;
  return f<.45?"Base":f<.8?"Build":"Peak";
}

function walkRunWeek(w){
  const t=[{run:1,walk:2,reps:8},{run:1,walk:2,reps:10},{run:2,walk:2,reps:7},
    {run:3,walk:2,reps:6},{run:4,walk:2,reps:5},{run:5,walk:2,reps:4},
    {run:7,walk:2,reps:3},{run:10,walk:2,reps:3},{run:12,walk:1,reps:2},
    {run:20,walk:1,reps:1},{run:25,walk:0,reps:1},{run:30,walk:0,reps:1}];
  return t[Math.min(w,t.length-1)];
}

function generatePlan(o){
  const cfg=LEVELS[o.level],grp=eventGroup(o.eventM),z=o.vdot?zonesFromVdot(o.vdot):null;
  const out=[];let km=o.startKm||cfg.startKm;

  for(let w=0;w<o.weeks;w++){
    const phase=phaseFor(w,o.weeks);
    const down=w>0&&(w+1)%4===0&&phase!=="Taper";

    if(o.level==="never"){
      const t=walkRunWeek(w);
      const desc=t.walk?t.reps+" × ("+t.run+" min jog / "+t.walk+" min walk)"
                       :t.run+" min continuous easy jog";
      out.push({week:w+1,phase:w<10?"On-ramp":"Base",volume:null,down:false,sessions:[
        {d:"Mon",type:"off",text:"Rest or 20 min walk"},
        {d:"Tue",type:"E",text:desc+" — conversational the whole way"},
        {d:"Wed",type:"off",text:"Rest, or strength: bodyweight squat / hinge / calf raise / plank"},
        {d:"Thu",type:"E",text:desc},
        {d:"Fri",type:"off",text:"Rest"},
        {d:"Sat",type:"E",text:desc+(w>=6?" + 5 min extra walk":"")},
        {d:"Sun",type:"off",text:"Rest or 30 min walk"}]});
      continue;
    }

    if(w>0)km=Math.min(cfg.maxKm,km*(1+cfg.step));
    let vol=down?km*.75:km;
    if(phase==="Taper")vol=km*(o.weeks-w===2?.55:.45);

    const days=o.daysPerWeek||cfg.days;
    const long=Math.round(vol*(grp==="long"?.3:.24));
    const P=(zone,m)=>z?fmtTime(lapFrom(z[zone].lo,m)):"--";
    const pk=zone=>z?fmtPace(z[zone].lo)+"/km":"--";

    const q=[];
    if(phase==="Base"){
      q.push({type:"T",text:"Threshold: 4 × 6 min at "+pk("T")+", 90 s jog between"});
      if(cfg.quality>=2)q.push({type:"R",text:"Hills: 8 × 10 s uphill sprint, walk down full recovery"});
    }else if(phase==="Build"){
      if(grp==="speed"){
        q.push({type:"I",text:"Intervals: 6 × 800 m at "+pk("I")+" ("+P("I",800)+" each), 90 s jog"});
        q.push({type:"R",text:"Reps: 8 × 200 m at "+pk("R")+" ("+P("R",200)+"), full recovery"});
      }else if(grp==="middle"){
        q.push({type:"I",text:"Intervals: 5 × 1000 m at "+pk("I")+" ("+P("I",1000)+"), 2:30 jog"});
        q.push({type:"T",text:"Threshold: 2 × 15 min at "+pk("T")+", 3 min jog"});
      }else{
        q.push({type:"T",text:"Threshold: 3 × 12 min at "+pk("T")+", 2 min jog"});
        q.push({type:"I",text:"Intervals: 5 × 3 min at "+pk("I")+", 3 min jog"});
      }
    }else if(phase==="Peak"){
      if(grp==="speed"){
        q.push({type:"R",text:"Race-specific: 3 × 400 m at "+pk("R")+" ("+P("R",400)+"), 4 min rest — then 1 × 600 m all out"});
        q.push({type:"I",text:"Broken race: 500 m + 300 m at goal pace, 3 min rest"});
      }else if(grp==="middle"){
        q.push({type:"I",text:"Race-specific: 3 × 1200 m at goal pace, 3 min jog"});
        q.push({type:"T",text:"Cruise: 5 × 1 km at "+pk("T")+", 60 s jog"});
      }else{
        q.push({type:"M",text:"Race-pace: "+Math.round(vol*.2)+" km at "+pk("M")+" inside a longer run"});
        q.push({type:"T",text:"Threshold: 20 min continuous at "+pk("T")});
      }
    }else{
      q.push({type:"T",text:"Sharpener: 3 × 4 min at "+pk("T")+", 2 min jog — hold the intensity, cut the volume"});
      if(grp!=="long")q.push({type:"R",text:"4 × 200 m at "+pk("R")+" ("+P("R",200)+"), full recovery"});
    }

    const qCount=Math.max(1,Math.min(q.length,cfg.quality===1?1:2));
    const names=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    const qDays=qCount===2?[1,4]:[2];
    const used=qDays.concat([6]);
    const free=[0,1,2,3,4,5].filter(i=>used.indexOf(i)===-1);
    const easyCount=Math.max(0,days-qCount-1);
    // Rest Monday first, then Friday — keeps quality days flanked by easy ones.
    const restSet=[0,4,3,5,2,1].filter(i=>free.indexOf(i)>-1)
                               .slice(0,Math.max(0,free.length-easyCount));
    let easyKm=Math.max(4,Math.round((vol-long-qCount*10)/Math.max(1,easyCount)));
    // Nobody runs a 21 km "easy run" four times a week. Past ~16 km it's a double.
    let dbl="";
    if(easyKm>16){dbl=" — split "+Math.round(easyKm*.6)+" km AM + "+Math.round(easyKm*.4)+" km PM";}
    const S=[];

    names.forEach((d,i)=>{
      if(i===6){
        S.push({d:d,type:"L",text:"Long run "+long+" km easy at "+pk("E")+
          (grp==="long"&&phase!=="Base"?" — last "+Math.round(long*.25)+" km at "+pk("M"):"")});
      }else if(qDays.indexOf(i)>-1&&q.length){
        const s=q.shift();
        S.push({d:d,type:s.type,text:s.text+" — 15 min warm-up and cool-down either side"});
      }else if(restSet.indexOf(i)>-1){
        S.push({d:d,type:"off",text:"Rest"});
      }else{
        S.push({d:d,type:"E",text:easyKm+" km easy at "+pk("E")+dbl+
          (i===2&&cfg.quality>=2?" + 4 × 100 m strides":"")});
      }
    });
    out.push({week:w+1,phase:phase,volume:Math.round(vol),down:down,sessions:S});
  }
  return out;
}

function recalibrate(vdot,log){
  if(!log.length)return{vdot:vdot,notes:[]};
  const notes=[];let v=vdot;
  const perf=log.filter(e=>(e.type==="race"||e.type==="tt")&&e.meters&&e.seconds)
    .sort((a,b)=>new Date(a.date)-new Date(b.date));
  perf.forEach(p=>{
    const raw=vdotFromRace(p.meters,p.seconds);
    if(raw&&isFinite(raw)){
      const b=v;v=.55*raw+.45*v;
      notes.push(p.date+": "+(p.meters/1000).toFixed(2)+" km in "+fmtTime(p.seconds)+
        " → VDOT "+b.toFixed(1)+" → "+v.toFixed(1));
    }
  });
  const qual=log.filter(e=>e.rpe&&["T","I","R","M"].indexOf(e.zone)>-1).slice(-2);
  if(qual.length===2&&qual.every(e=>e.rpe>=9)){v-=1;
    notes.push("Two quality sessions at RPE 9+ — paces cut by one VDOT point. The prescription was too hot.");}
  if(qual.length===2&&qual.every(e=>e.rpe<=5)){v+=.5;
    notes.push("Two quality sessions felt easy — paces nudged up half a point.");}
  const last=log.map(e=>new Date(e.date)).sort((a,b)=>b-a)[0];
  const gap=Math.floor((Date.now()-last)/86400000);
  if(gap>10){const f=detrainFactor(gap);v*=f;
    notes.push(gap+" days without a logged run — fitness estimate reduced "+
      Math.round((1-f)*100)+"% and the plan rebuilds from a lower base.");}
  return{vdot:Math.max(25,Math.min(85,v)),notes:notes};
}

function guardFlags(){
  const a=S.ath,f=[];
  const bmi=a.weightKg/Math.pow(a.heightCm/100,2);
  if(a.symptoms)f.push({sev:"stop",msg:"You reported a symptom that needs a doctor. Training is paused until you've been cleared."});
  if(a.lea&&a.lea.length)f.push({sev:"stop",msg:"Low-energy-availability signs reported. Do not increase training — this needs a sports physician or dietitian first."});
  if(a.parq.some(Boolean))f.push({sev:"warn",msg:"PAR-Q+ flagged. Get clearance before vigorous training."});
  if(bmi>=30)f.push({sev:"warn",msg:"Higher injury risk at this body mass. Walk-run on-ramp and slower progression are deliberate."});
  if(a.priorInjury)f.push({sev:"warn",msg:"Previous running injury raises new-injury odds sharply. Progression is capped tighter."});

  const now=Date.now();
  const wk=S.log.filter(e=>now-new Date(e.date)<7*86400000);
  if(wk.length){
    const daily=[0,0,0,0,0,0,0];
    wk.forEach(e=>{const d=Math.floor((now-new Date(e.date))/86400000);
      if(d<7)daily[d]+=sessionLoad(e.rpe||5,e.minutes||0);});
    const st=weekLoadStats(daily);
    if(st.monotony>2)f.push({sev:"warn",msg:"Training monotony "+st.monotony+
      " — every day looks the same. Make easy days easier and hard days harder."});
    if(st.strain>6000)f.push({sev:"warn",msg:"Weekly strain "+st.strain+" is high. Take a consolidation week."});
  }
  return f;
}

function spectrumHTML(z){
  const v=s=>60000/s;
  const lo=v(z.E.lo)*.97,hi=v(z.R.hi)*1.03;
  const x=s=>((v(s)-lo)/(hi-lo))*100;
  const bands=[{k:"E",a:z.E.lo,b:z.E.hi},{k:"M",a:z.E.hi,b:z.M.lo},
    {k:"T",a:z.T.lo*1.012,b:z.T.lo*.988},{k:"I",a:z.I.lo*1.012,b:z.I.lo*.988},
    {k:"R",a:z.R.lo*1.015,b:z.R.lo*.985}];
  let rects="",labels="";
  bands.forEach(b=>{
    const x1=x(b.a),x2=x(b.b);
    rects+='<rect x="'+Math.min(x1,x2)+'" y="9" width="'+Math.max(.7,Math.abs(x2-x1))+
      '" height="8" fill="'+ZC[b.k]+'" opacity=".92"/>';
    const mid=Math.max(2,Math.min(96,(x1+x2)/2));
    labels+='<div class="disp" style="position:absolute;left:'+mid+'%;transform:translateX(-50%);'+
      'text-align:center;font-size:15px;color:'+ZC[b.k]+'">'+b.k+
      '<div class="num" style="font-size:10.5px;color:var(--ink-faint);letter-spacing:0">'+
      fmtPace(b.k==="E"?z.E.hi:z[b.k].lo)+'</div></div>';
  });
  return '<div style="margin:6px 0 4px">'+
    '<svg viewBox="0 0 100 26" preserveAspectRatio="none" style="width:100%;height:74px">'+
    '<rect x="0" y="9" width="100" height="8" fill="var(--surface-2)"/>'+rects+'</svg>'+
    '<div style="position:relative;height:34px;margin-top:-30px">'+labels+'</div>'+
    '<div class="faint" style="margin-top:26px">Slower ← velocity → faster. Easy is a wide window '+
    'you cannot really get wrong. Threshold and interval are narrow — that is where seconds per '+
    'kilometre actually decide whether the session works.</div></div>';
}

    html+='<div class="card tight" style="opacity:.45;pointer-events:none">'+

        '</div>').join("")+
      '<div class="faint" style="text-align:center;padding:10px 0">· · ·</div></div>';
    html+=paywall("The other "+rest+" weeks are where the race is won",[
      "Every remaining week, session by session, all the way to race day",
      "The build, the peak, and the taper — the part that actually makes you faster",
      "Your log, so the plan rebuilds itself around the runs you really did",
      "The coach, who answers you and adjusts when life gets in the way"],
      "week "+(FREE_WEEKS+1)+" of my plan");
    html+='<div class="card"><span class="eyebrow">Why only two weeks free</span>'+
      '<p class="muted" style="margin-top:8px">Two weeks is enough to prove the paces are right and the '+
      'sessions are real. It is not enough to get you fit. Fitness comes from the block — the progression, '+
      'the consolidation weeks, and the taper — and that is what a membership buys.</p></div>';
    return html;
  }

  html+='<div class="card"><span class="eyebrow">Why it is shaped this way</span>'+

    'volume to about half while intensity stays exactly where it is: reducing intensity during a taper '+
    'does not improve performance, and reliably costs you sharpness.</p></div>';
  return html;
}

function vLog(){
  if(!isPro())return paywall("The log is what makes this a coach instead of a calculator.",[
    "Log every run and your paces move with your real fitness, not a number from months ago",
    "A race or time trial re-rates you on the spot",
    "Two brutal sessions in a row and the plan backs off before you break",
    "Miss ten days and it rebuilds from an honest lower base instead of pretending",
    "Load, monotony and strain, so you see a bad week coming"],"the log");
  const L=live(),flags=guardFlags();
  const now=Date.now();
  const wk=S.log.filter(e=>now-new Date(e.date)<7*86400000);
  const daily=[0,0,0,0,0,0,0];
  wk.forEach(e=>{const d=Math.floor((now-new Date(e.date))/86400000);
    if(d<7)daily[d]+=sessionLoad(e.rpe||5,e.minutes||0);});
  const st=weekLoadStats(daily);
  const today=new Date().toISOString().slice(0,10);

  let html='<div class="card"><span class="eyebrow">Log a session</span><div class="row" style="margin-top:12px">'+
    fld("Date",'<input id="l_date" type="date" value="'+today+'">')+

    '</div><div class="row">'+

    '</div>'+fld("How it felt",'<input id="l_note" placeholder="legs flat after lap 4">')+
    '<button data-act="addlog">Add session</button></div>';

  if(S.log.length){
    html+='<div class="card"><span class="eyebrow">Last 7 days</span><div class="row" style="margin-top:12px;gap:24px">'+
      stat("Load",st.total)+

      stat("Strain",st.strain,st.strain>6000?"var(--z-i)":null)+
      stat("Volume",wk.reduce((a,b)=>a+b.meters/1000,0).toFixed(1)+" km")+
      '</div></div>';
  }

  if(L.notes.length){
    html+='<div class="card"><span class="eyebrow">Recalibration — VDOT '+
      (S.ath.vdot?S.ath.vdot.toFixed(1):"—")+' → '+(L.vdot?L.vdot.toFixed(1):"—")+'</span>'+
      L.notes.map(n=>'<div class="flag ok">'+esc(n)+'</div>').join("")+'</div>';
  }
  html+=flags.filter(f=>f.sev==="warn").map(f=>'<div class="flag warn">'+esc(f.msg)+'</div>').join("");

  html+='<div class="card"><span class="eyebrow">History</span>'+
    (!S.log.length?'<p class="muted" style="margin-top:8px">Nothing logged yet. Every session you add '+
      'moves your paces — a race or time trial moves them hard, and two brutal workouts in a row will '+
      'pull them back down.</p>'
     :'<table style="margin-top:10px"><thead><tr><th>Date</th><th>Session</th><th>Pace</th><th>RPE</th><th></th></tr></thead><tbody>'+
      S.log.map((x,i)=>'<tr><td class="num" style="font-size:13px">'+esc(x.date)+'</td>'+
        '<td><span class="zdot" style="background:'+ZC[x.zone]+'"></span>'+(x.meters/1000).toFixed(2)+' km '+
        (x.type!=="run"?'<span class="pill">'+esc(x.type)+'</span>':"")+
        (x.note?'<div class="faint">'+esc(x.note)+'</div>':"")+'</td>'+
        '<td class="num">'+fmtPace(x.seconds/x.meters*1000)+'</td><td class="num">'+x.rpe+'</td>'+
        '<td><button class="ghost" style="padding:3px 9px;font-size:11px" data-del="'+i+'">Remove</button></td></tr>').join("")+
      '</tbody></table>')+'</div>';
  return html;
}
function stat(label,val,color){

const VIEWS={setup:vSetup,paces:vPaces,plan:vPlan,log:vLog,coach:vCoach,settings:vSettings};
const TABS=[["setup","Setup"],["paces","Paces"],["plan","Plan"],["log","Log"],["coach","Coach"],["settings","More"]];

function render(){
  const L=live();
  document.getElementById("vdotOut").textContent=L.vdot?L.vdot.toFixed(1):"—";
  const flags=guardFlags(),halted=flags.some(f=>f.sev==="stop");
  let head="";
  if(halted)head='<div class="flag stop" style="margin-top:16px"><strong>Training is paused.</strong> '+
    esc(flags.filter(f=>f.sev==="stop")[0].msg)+' Nothing in this app substitutes for that conversation — please have it first.</div>';
  document.getElementById("view").innerHTML=head+VIEWS[S.tab]();
  document.getElementById("tabs").innerHTML=TABS.map(t=>
    '<button class="disp'+(S.tab===t[0]?" on":"")+'" data-tab="'+t[0]+'">'+t[1]+'</button>').join("");
  window.scrollTo(0,0);
}

const val=id=>{const e=document.getElementById(id);return e?e.value:"";};
const numv=(id,d)=>{const v=parseFloat(val(id));return isNaN(v)?d:v;};

document.addEventListener("change",e=>{
  const c=e.target.getAttribute("data-chk");
  if(!c)return;
  const on=e.target.checked,a=S.ath;
  if(c.indexOf("parq")===0)a.parq[+c.slice(4)]=on;
  else if(c==="sym")a.symptoms=on;
  else if(c.indexOf("lea")===0){const i=+c.slice(3);
    a.lea=on?a.lea.concat([i]):a.lea.filter(x=>x!==i);}
  else if(c==="act")a.active=on;
  else if(c==="inj")a.priorInjury=on;
  persist();
  const cl=acsmClearance({active:a.active,disease:a.parq.slice(0,5).some(Boolean),
    symptoms:a.symptoms,wantsVigorous:a.level!=="never"});
  const node=document.getElementById("clear");
  if(node){node.textContent=cl.text;
    node.className="flag "+(cl.level==="stop"?"stop":cl.level==="ok"?"ok":"warn");}
});

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-act],[data-week],[data-del],[data-say]");
  if(!t)return;

  if(t.dataset.tab){S.tab=t.dataset.tab;render();return;}
  if(t.dataset.week!==undefined&&t.dataset.week!==""){
    S.openWeek=S.openWeek===+t.dataset.week?-1:+t.dataset.week;render();return;}
  if(t.dataset.del!==undefined&&t.dataset.del!==""){
    S.log.splice(+t.dataset.del,1);persist();render();return;}
  if(t.dataset.say){document.getElementById("c_in").value=t.dataset.say;return;}

  const act=t.dataset.act;

  if(act==="commit"){
    const a=S.ath;
    a.name=val("f_name");a.age=numv("f_age",30);a.weightKg=numv("f_wt",65);
    a.heightCm=numv("f_ht",170);a.male=val("f_sex")==="m";a.level=val("f_lvl");
    a.raceDist=val("f_rd");a.raceTime=val("f_rt");a.event=val("f_ev");
    a.weeks=numv("f_wk",12);a.days=numv("f_dy",5);a.hrRest=numv("f_hrr",55);
    const hm=numv("f_hrm",0);a.hrMax=hm>100?hm:null;

    let vdot=null;
    const secs=parseTime(a.raceTime);
    const dist=DISTANCES.filter(d=>d.id===a.raceDist)[0];
    if(secs&&dist)vdot=vdotFromRace(dist.m,secs);
    else{
      const cooper=parseFloat(val("f_cooper"));
      const rt=parseTime(val("f_rockt")),rhr=parseFloat(val("f_rockhr"));
      if(cooper>0)vdot=cooperVo2(cooper)*.85;
      else if(rt&&rhr>0)vdot=rockportVo2({weightKg:a.weightKg,age:a.age,male:a.male,
        minutes:rt/60,hr:rhr})*.85;
    }
    a.vdot=(vdot&&isFinite(vdot))?Math.max(25,Math.min(85,vdot)):null;
    a.done=true;persist();
    S.tab=a.vdot?"paces":"plan";render();return;
  }

  if(act==="cs"){
    const tr=[0,1,2].map(i=>({m:parseFloat(val("cs_m"+i))||0,s:parseTime(val("cs_t"+i))||0}));
    const cs=criticalSpeed(tr);
    document.getElementById("csOut").innerHTML=cs
      ?'<div class="flag ok"><strong class="num">CS '+fmtPace(cs.pace)+'/km</strong> · D′ '+
       Math.round(cs.dPrime)+' m. High CS and low D′ means front-run and grind. Low CS and high D′ means '+
       'sit and kick — you have more above-threshold currency to spend in the last 200.</div>'
      :'<div class="flag warn">Need at least two efforts with both distance and time filled in.</div>';
    return;
  }

  if(act==="addlog"){
    const km=parseFloat(val("l_km")),secs=parseTime(val("l_time"));
    if(!km||!secs){alert("Distance and time are both needed to log a session.");return;}
    S.log.push({date:val("l_date"),type:val("l_type"),zone:val("l_zone"),
      meters:km*1000,seconds:secs,minutes:secs/60,rpe:numv("l_rpe",5),note:val("l_note")});
    S.log.sort((a,b)=>new Date(b.date)-new Date(a.date));
    persist();render();return;
  }

  if(act==="savecfg"){
    S.cfg.apiKey=val("s_key").trim();S.cfg.model=val("s_model");persist();
    alert("Saved. The coach is live.");render();return;
  }

  if(act==="export"){
    const blob=new Blob([JSON.stringify({ath:S.ath,log:S.log},null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="sanercoach-backup-"+new Date().toISOString().slice(0,10)+".json";
    a.click();URL.revokeObjectURL(a.href);return;
  }

  if(act==="import"){document.getElementById("s_file").click();return;}

  if(act==="wipe"){
    if(confirm("Erase your profile, every logged session, and your key? This cannot be undone."))
      {localStorage.removeItem(KEY);restore();render();}
    return;
  }

  if(act==="gocode"){S.tab="settings";render();
    setTimeout(()=>{const el=document.getElementById("s_code");if(el)el.focus();},60);return;}

  if(act==="redeem"){
    const ok=redeem(val("s_code"));
    const out=document.getElementById("codeOut");
    if(ok){render();alert("Unlocked. Your full plan, log and coach are open.");}
    else if(out)out.innerHTML='<div class="flag warn">That code was not recognised. Check for a typo, or '+
      'email me and I will resend it.</div>';
    return;
  }

  if(act==="signout"){
    if(confirm("Lock the app back to the free version on this device?")){S.pro=false;persist();render();}
    return;
  }

  if(act==="clearchat"){S.chat=[];persist();render();return;}
  if(act==="send"){send();return;}
});

document.addEventListener("change",e=>{
  if(e.target.id!=="s_file"||!e.target.files.length)return;

function brief(){
  const L=live(),a=S.ath,flags=guardFlags();
  const z=L.zones?("E "+fmtPace(L.zones.E.hi)+"-"+fmtPace(L.zones.E.lo)+", M "+fmtPace(L.zones.M.lo)+
    ", T "+fmtPace(L.zones.T.lo)+", I "+fmtPace(L.zones.I.lo)+", R "+fmtPace(L.zones.R.lo)+" per km")
    :"no paces yet — no valid baseline";
  const recent=S.log.slice(0,8).map(e=>e.date+" "+(e.meters/1000).toFixed(1)+"km @ "+
    fmtPace(e.seconds/e.meters*1000)+"/km zone "+e.zone+" RPE "+e.rpe+
    (e.note?' "'+e.note+'"':"")).join("\n")||"nothing logged";
  const ev=(DISTANCES.filter(d=>d.id===a.event)[0]||{label:"unset"}).label;

  return "You are the coaching layer of Saner Coach, a running app. You give judgement; a deterministic engine "+
"already produced the numbers below and you must not contradict them.\n\n"+
"ATHLETE\nName: "+(a.name||"unnamed")+" · age "+a.age+" · "+(a.male?"M":"F")+" · "+a.weightKg+" kg\n"+
"Level: "+LEVELS[a.level].label+" · goal: "+ev+" in "+a.weeks+" weeks · "+a.days+" days/week\n"+
"VDOT: "+(L.vdot?L.vdot.toFixed(1):"none")+"\nPaces: "+z+"\n\n"+
"RECENT SESSIONS\n"+recent+"\n\n"+
"OPEN FLAGS\n"+(flags.length?flags.map(f=>"["+f.sev+"] "+f.msg).join("\n"):"none")+"\n\n"+
"RULES YOU CANNOT BREAK\n"+
"- If a stop-flag is open, do not prescribe or adjust training. Say plainly that this needs a doctor first, and stop there.\n"+
"- Never prescribe faster than the engine's paces. You may prescribe slower.\n"+
"- Never encourage training through pain, restriction, or under-fuelling. If low energy availability or "+
"disordered eating appears, respond with care and point toward a sports physician or dietitian — do not "+
"adjust training as the answer.\n"+
"- Never claim anyone can become elite. Be honest: nearly everyone improves a great deal; elite outcomes "+
"are bounded by genetics, training age, and time. Say so warmly, not clinically.\n"+
"- Under-18 athletes get conservative volume only.\n\n"+
"VOICE\nDirect, warm, specific. Short paragraphs. Give the reason behind the instruction — an athlete who "+
"understands why will pace it correctly when you are not there. Use their actual numbers. No filler, no "+
"hedging, no motivational slogans.";
}

let busy=false;
function send(){
  const box=document.getElementById("c_in");
  if(!box)return;
  const text=box.value.trim();
  if(!text||busy)return;
  if(!S.cfg.apiKey){S.tab="settings";render();
    alert("Add an API key first — the coach needs one to reach a model.");return;}

  S.chat.push({role:"user",content:text});
  box.value="";busy=true;persist();

  const chat=document.getElementById("chat");
  chat.insertAdjacentHTML("beforeend",'<div class="bubble me">'+esc(text)+'</div>'+
    '<div class="bubble ai" id="pending"><span class="eyebrow">thinking…</span></div>');
  document.getElementById("pending").scrollIntoView({behavior:"smooth",block:"end"});

  const msgs=S.chat.map((m,i)=>i===0?{role:"user",content:brief()+"\n\n---\nAthlete says: "+m.content}:m);

  fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":S.cfg.apiKey,
      "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    // Current models think before answering, and thinking counts toward max_tokens.
    // Too small a budget gets spent reasoning and returns no text at all.
    body:JSON.stringify({model:S.cfg.model,max_tokens:4096,messages:msgs})
  }).then(r=>r.json()).then(d=>{
    if(d.error)throw new Error(d.error.message||"request rejected");
    const out=(d.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n");
    S.chat.push({role:"assistant",content:out||"The reply came back empty. Try asking again."});
  }).catch(err=>{
    const m=String(err.message||"");
    let hint="";
    if(/authentication|invalid.*api.*key|x-api-key/i.test(m))
      hint="\n\nThat key was not accepted. Check for a stray space, or create a fresh one — keys are shown only once, so a half-copied key is the usual cause.";
    else if(/credit|billing|quota|balance/i.test(m))
      hint="\n\nThe key is valid but has no credit behind it. API billing is separate from a Claude.ai subscription — add prepaid credit under Plans & Billing in the console.";
    else if(/model/i.test(m))
      hint="\n\nThat model name was rejected. Pick another from the dropdown in More.";
    else if(/rate|overloaded|529/i.test(m))
      hint="\n\nThe API is busy. Wait a moment and send again.";
    S.chat.push({role:"assistant",content:"Could not reach the model — "+m+hint+
      "\n\nYour paces, plan and log all still work; none of that needs a connection."});
  }).finally(()=>{busy=false;persist();render();
    window.scrollTo(0,document.body.scrollHeight);});
}

/* ------------------------------------------------------------------- BOOT -*/
restore();
render();
</script>
</body>
